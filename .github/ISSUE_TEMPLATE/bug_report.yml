name: Bug report
description: Report a reproducible problem with rx4u.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here. Use the process described in SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample or repository that demonstrates the problem.
      render: ts
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: rx4u version
      placeholder: 0.1.7
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Node.js version, package manager, and relevant runtime or browser details.
    validations:
      required: true
